# portals-cv2.yml — Track 2: mid-level AI Application / FDE / Solutions,
# DACH + EU-remote.
#
# Selected at scan time via CAREER_OPS_PORTALS=portals-cv2.yml (see
# fork issue #2 for the full spec/plan this file implements).
#
# Public targeting keywords + public company info only — no personal data.
# This file IS tracked in the fork (public repo).

title_filter:
  positive:
    - "AI Engineer"
    - "AI Application"
    - "Applied AI"
    - "Forward Deployed"
    - "Solutions Engineer"
    - "AI Solutions"
    - "LLM"
    - "GenAI"
    - "Machine Learning Engineer"
    - "ML Engineer"
    - "Senior AI"
  negative:
    - "Intern"
    - "Internship"
    - "Werkstudent"
    - "Praktikum"
    - "Research Scientist"
    - "Staff"
    - "Principal"
    - "Director"
    - "Head of"
    - "PhD"
    - "Professor"

# Channel C (2026-07-30): remote work for any client country is legal from Linz
# via Ahmad's Austrian Gewerbe, so "Remote" is always_allow'd and outranks the
# block list. The block list exists only to reject ON-SITE roles in countries
# where he would need a work permit he does not have. Whether a specific remote
# posting is actually open to him ("must reside in X", "W-2 only") is an eval-layer
# judgement -- see house rule 18. Do not add two-letter country codes to block:
# substring matching makes them landmines ("AUS" blocks Austria, "CH" blocks
# Munich, "IN" blocks Linz, "KOR" blocks Korneuburg).
location_filter:
  always_allow:
    - "Remote"
    - "Anywhere"
    - "Worldwide"
    - "Distributed"
    - "Homeoffice"
    - "Home office"
    - "Austria"
    - "Österreich"
    - "Vienna"
    - "Wien"
    - "Linz"
    - "Graz"
    - "Salzburg"
    # Bare Austrian city strings with no country suffix -- see the same list in
    # portals-cv3.yml; "Pasching" was silently rejected before these were added.
    - "Villach"
    - "Pasching"
    - "Innsbruck"
    - "Klagenfurt"
    - "Wels"
    - "Steyr"
    - "Leonding"
    - "Traun"
    - "Hagenberg"
    - "St. Pölten"
    - "Europe"
    - "Europa"
    - "EMEA"
    - "European Union"
    - "Germany"
    - "Deutschland"
    - "Netherlands"
    - "Ireland"
    - "Poland"
    - "Portugal"
    - "Spain"
    - "France"
    - "Italy"
    - "Sweden"
    - "Denmark"
    - "Finland"
    - "Czech"
    - "Romania"
    - "United Kingdom"
    - "London"
  allow:
    - "Austria"
    - "Germany"
    - "Netherlands"
    - "Remote"
    - "EU"
    - "Europe"
    - "Wien"
    - "Vienna"
    - "Linz"
    - "München"
    - "Munich"
    - "Berlin"
    - "Hamburg"
    - "Frankfurt"
    - "Amsterdam"
    - "London"
    - "United Kingdom"
    - "Cologne"
    - "Köln"
    - "Walldorf"
    - "Stuttgart"
    - "Paris"
    - "Heidelberg"
  # v1 — tune after measuring. UK stays IN at scan (sponsorship is an eval
  # gate, not a scan-time filter); Switzerland/US/India excluded for this
  # mid-level DACH+EU-remote track.
  block:
    - "Switzerland"
    - "Zürich"
    - "Zurich"
    - "United States"
    - "USA"
    - "India"
    - "Canada"
    - "Singapore"
    - "China"
    - "Japan"
    - "Brazil"
    - "Mexico"
    - "Australia"
    - "Philippines"
    - "Vietnam"
    - "Thailand"
    - "Israel"

# Missing salary passes (correct default) — most postings in this track don't
# publish comp, and a hard drop would lose them.
# EU Blue Card shortage-occupation threshold (covers mainstream IT/software/
# data/ML roles) -- verified July 2026, see career-ops-handoff.md section 4
# ("Visa / Work-Rights Facts"). Re-verify before relying on this figure in
# any actual application or decision -- it is not re-checked by this file.
salary_filter:
  min: 45934
  max: 0
  currency: "EUR"

# Drop only explicit no-sponsorship postings; don't require a mention (most
# postings say nothing either way).
visa_filter:
  enabled: true
  require_mention: false

max_posting_age_days: 45

trust_filter:
  enabled: true

search_queries:
  - name: Greenhouse — Forward Deployed / AI Engineer DACH
    query: 'site:job-boards.greenhouse.io "Forward Deployed" OR "AI Engineer" OR "Applied AI" Germany OR Austria OR DACH OR Berlin OR Munich'
    enabled: true

  - name: Lever — Forward Deployed / AI Engineer DACH
    query: 'site:jobs.lever.co "Forward Deployed" OR "AI Engineer" OR "Applied AI" Germany OR Austria OR DACH OR Berlin OR Munich'
    enabled: true

  - name: Ashby — Forward Deployed / AI Engineer DACH
    query: 'site:jobs.ashbyhq.com "Forward Deployed" OR "AI Engineer" OR "Applied AI" Germany OR Austria OR DACH OR Berlin OR Munich'
    enabled: true

  - name: Greenhouse/Ashby/Lever — Solutions Engineer AI DACH
    query: 'site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co "Solutions Engineer" AI Germany OR Austria OR Berlin OR Munich OR Amsterdam remote'
    enabled: true

# -- Tracked companies --
# Every entry that lived here was migrated to the private, gitignored
# portals.yml on 2026-08-03 (issue #23) -- this track has no board/
# aggregator source of its own, so the list is empty.
tracked_companies: []
