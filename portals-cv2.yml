# portals-cv2.yml — Track 2: mid-level AI Application / FDE / Solutions,
# DACH + EU-remote.
#
# Selected at scan time via CAREER_OPS_PORTALS=portals-cv2.yml (see
# fork issue #2 for the full spec/plan this file implements).
#
# Public targeting keywords + public company info only — no personal data.
# This file IS tracked in the fork (public repo).

title_filter:
  positive:
    - "AI Engineer"
    - "AI Application"
    - "Applied AI"
    - "Forward Deployed"
    - "Solutions Engineer"
    - "AI Solutions"
    - "LLM"
    - "GenAI"
    - "Machine Learning Engineer"
    - "ML Engineer"
    - "Senior AI"
  negative:
    - "Intern"
    - "Internship"
    - "Werkstudent"
    - "Praktikum"
    - "Research Scientist"
    - "Staff"
    - "Principal"
    - "Director"
    - "Head of"
    - "PhD"
    - "Professor"

location_filter:
  allow:
    - "Austria"
    - "Germany"
    - "Netherlands"
    - "Remote"
    - "EU"
    - "Europe"
    - "Wien"
    - "Vienna"
    - "Linz"
    - "München"
    - "Munich"
    - "Berlin"
    - "Hamburg"
    - "Frankfurt"
    - "Amsterdam"
    - "London"
    - "United Kingdom"
    - "Cologne"
    - "Köln"
    - "Walldorf"
    - "Stuttgart"
    - "Paris"
    - "Heidelberg"
  # v1 — tune after measuring. UK stays IN at scan (sponsorship is an eval
  # gate, not a scan-time filter); Switzerland/US/India excluded for this
  # mid-level DACH+EU-remote track.
  block:
    - "Switzerland"
    - "Zürich"
    - "Zurich"
    - "United States"
    - "India"

# Missing salary passes (correct default) — most postings in this track don't
# publish comp, and a hard drop would lose them.
# EU Blue Card shortage-occupation threshold (covers mainstream IT/software/
# data/ML roles) -- verified July 2026, see career-ops-handoff.md section 4
# ("Visa / Work-Rights Facts"). Re-verify before relying on this figure in
# any actual application or decision -- it is not re-checked by this file.
salary_filter:
  min: 45934
  max: 0
  currency: "EUR"

# Drop only explicit no-sponsorship postings; don't require a mention (most
# postings say nothing either way).
visa_filter:
  enabled: true
  require_mention: false

max_posting_age_days: 45

trust_filter:
  enabled: true

search_queries:
  - name: Greenhouse — Forward Deployed / AI Engineer DACH
    query: 'site:job-boards.greenhouse.io "Forward Deployed" OR "AI Engineer" OR "Applied AI" Germany OR Austria OR DACH OR Berlin OR Munich'
    enabled: true

  - name: Lever — Forward Deployed / AI Engineer DACH
    query: 'site:jobs.lever.co "Forward Deployed" OR "AI Engineer" OR "Applied AI" Germany OR Austria OR DACH OR Berlin OR Munich'
    enabled: true

  - name: Ashby — Forward Deployed / AI Engineer DACH
    query: 'site:jobs.ashbyhq.com "Forward Deployed" OR "AI Engineer" OR "Applied AI" Germany OR Austria OR DACH OR Berlin OR Munich'
    enabled: true

  - name: Greenhouse/Ashby/Lever — Solutions Engineer AI DACH
    query: 'site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co "Solutions Engineer" AI Germany OR Austria OR Berlin OR Munich OR Amsterdam remote'
    enabled: true

# -- Tracked companies --
# Every careers_url/api/provider slug below was live-verified (HTTP 200
# against the actual API/board, not guessed from memory) before being added.
# Companies shared with portals-cv1.yml (Aleph Alpha, DeepL, Celonis,
# Dynatrace, SAP, Siemens, Bosch, Zalando) reuse the same verified
# careers_url/provider/api — only the track-specific framing in notes differs.
tracked_companies:
  - name: Amazon / AWS — Solutions Engineer Berlin
    provider: amazon
    amazon:
      base_query: "solutions engineer"
      loc_query: "Berlin"
    notes: "Global amazon.jobs board narrowed with a Solutions Engineer keyword + Berlin location signal (recall-first — scan.mjs's own title/location filters do the real gating). Verified live (153 hits for this query)."
    enabled: true

  - name: Google — Munich
    careers_url: "https://www.google.com/about/careers/applications/jobs/results/?company=Google&company=YouTube&employment_type=FULL_TIME&location=Munich%2C%20Germany&sort_by=relevance"
    scan_method: websearch
    scan_query: 'site:google.com/about/careers/applications "AI" OR "Machine Learning" OR "Solutions" Munich'
    notes: "Custom platform, no ATS API. Live-verified filter URL confirmed 24 full-time Munich roles at verification time incl. AI/ML and Customer Engineer (Solutions-shaped) postings."
    enabled: true

  - name: Microsoft — Germany
    careers_url: "https://apply.careers.microsoft.com/careers?location=Germany&sort_by=distance"
    scan_method: websearch
    scan_query: 'site:careers.microsoft.com "AI" OR "Solution Engineer" OR "Solutions Architect" Germany'
    notes: "Custom platform, no ATS API. Live-verified: 11 Germany roles at verification time incl. Azure AI Services and Solution Engineer/Architect postings. Note: the commonly-referenced lc=Germany URL param is silently dropped by a redirect — this URL was reconstructed through the live UI to confirm it actually filters."
    enabled: true

  - name: Apple — Germany
    careers_url: "https://jobs.apple.com/en-us/search?location=germany-DEU"
    scan_method: websearch
    scan_query: 'site:jobs.apple.com "Machine Learning" OR "AI" Germany'
    notes: "Custom platform, no ATS API. Live-verified: 75 results at verification time incl. Machine Learning Researcher (Munich) and AIML Applied Research Engineer (Aachen)."
    enabled: true

  - name: Meta — Germany
    careers_url: "https://www.metacareers.com/jobsearch/?q=Germany"
    scan_method: websearch
    scan_query: 'site:metacareers.com "AI" OR "Machine Learning" OR "Solutions" Germany'
    notes: "Custom platform, no ATS API. q=Germany is a keyword match, not a strict location facet (per-office offices[] filters returned worse results at verification time) — kept as the best available, inventory was thin/non-AI-shaped at verification time."
    enabled: true

