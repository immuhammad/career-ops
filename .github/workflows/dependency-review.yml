name: Dependency Review
# fork patch (immuhammad/career-ops): career-ops-custom is this fork's working
# branch under the vendor-branch model (main = pristine upstream mirror) --
# PRs target career-ops-custom, so the trigger must cover it too. See house
# rule 12, modes/_custom.md.
on:
  pull_request:
    branches: [main, career-ops-custom]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        # TODO: remove continue-on-error once the Dependency graph is enabled in
        # Settings > Security & Analysis (see #343). Until then, this is a temporary
        # workaround to unblock PRs — note that fail-on-severity: high is still
        # configured but will not block merges while continue-on-error is true.
        continue-on-error: true
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
