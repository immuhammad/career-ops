# portals-cv1.yml — Track 1: Werkstudent (AT) + Praktikum/internships (AT+DE+EU)
#
# Selected at scan time via CAREER_OPS_PORTALS=portals-cv1.yml (see
# fork issue #1 for the full spec/plan this file implements).
#
# Public targeting keywords + public company info only — no personal data.
# This file IS tracked in the fork (public repo).

title_filter:
  # German AND English student-role terms. Title match is substring-OR;
  # domain narrowing (AI/ML/Data/Software) happens in content_filter below,
  # not here — these terms alone are department-agnostic.
  positive:
    - "Werkstudent"
    - "Working Student"
    - "Praktikum"
    - "Praktikant"
    - "Intern"
    - "Internship"
    - "Trainee"
    - "Thesis"
    - "Diplomarbeit"
    - "Abschlussarbeit"
  negative:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "Manager"
    - "Sales"
    - "Marketing"
    - "Recruiting"
    - "HR"
    - "Legal"

# Domain narrowing on the job description. All of the title keywords above
# are department-agnostic (a "Werkstudent" or "Praktikum" posting exists in
# every department), so this applies globally rather than per-keyword via
# by_title_keyword — v1 measures the noise level first before tightening
# further to specific keywords.
content_filter:
  positive:
    - "AI"
    - "Machine Learning"
    - "ML"
    - "Data"
    - "Software"
    - "Backend"
    - "Python"
    - "LLM"
  # Hard stop 2a (issue #13): explicit German-language REQUIREMENT phrases,
  # not just German-language JDs -- Austrian Werkstudent/Praktikum postings
  # are routinely advertised in German by English-speaking engineering teams
  # (see hard-stop-2b note near location_filter below), so gating on the JD's
  # own language would gut this track. Gating on an explicit fluency
  # REQUIREMENT is precise instead: a JD that demands verhandlungssicheres/
  # fluent/native German is a real signal the workplace itself runs in
  # German, distinct from a JD merely WRITTEN in German.
  #
  # CAVEAT, verified in scan.mjs, not assumed: content_filter only ever sees
  # `job.description`, and only Lever's list API ships that for free -- every
  # other provider (Greenhouse/Ashby/SmartRecruiters/SuccessFactors/Workday/
  # Recruitee/Personio/TeamTailor/Pinpoint/Arbeitnow/Arbeitsagentur/Amazon)
  # leaves it empty, and an empty description always PASSES this filter. None
  # of this file's current sources are Lever-based, so this gate has ~zero
  # practical effect at scan time today -- it is real, forward-looking config
  # (fires the moment a Lever source is added, or if a websearch-handoff
  # research pass checks the full JD), not an active filter right now. Do not
  # assume it is catching anything yet.
  #
  # AMENDMENT (issue #13, Ahmad, after Austria-only narrowing was confirmed):
  # a bare substring match on a language TERM is not enough -- Austria-only
  # narrowing makes this gate MORE dangerous, not less, because a large share
  # of genuinely English-friendly Austrian roles are still ADVERTISED in
  # German. "Deutschkenntnisse von Vorteil" (German an ADVANTAGE, not
  # required) must NOT be rejected -- that is exactly the kind of role this
  # track exists to find. So every keyword below is a REQUIREMENT-qualified
  # compound phrase, not a bare language term: dropped the bare
  # "Deutschkenntnisse" and "sehr gute Deutschkenntnisse" forms from the
  # original seed list, since both are grammatically compatible with a
  # trailing "von Vorteil"/"wuenschenswert" softener that would flip their
  # meaning -- keeping them risked exactly the false-positive Ahmad flagged.
  #
  # MECHANICAL LIMIT, stated not hidden: content_filter (scan.mjs) is a flat
  # substring-match list with no proximity/exclusion logic -- it cannot
  # express "reject on X unless followed by Y" natively. Compound,
  # requirement-qualified phrasing is the closest available substitute, not
  # a guarantee: a sufficiently creative JD could still in principle pair one
  # of these exact compounds with a softener. Residual risk, not eliminated.
  negative:
    - "Deutschkenntnisse erforderlich"
    - "Deutschkenntnisse vorausgesetzt"
    - "Deutschkenntnisse zwingend"
    - "verhandlungssichere Deutsch"
    - "verhandlungssicheres Deutsch"
    - "fließende Deutsch"
    - "fließendes Deutsch"
    - "Muttersprache Deutsch"
    - "Deutsch auf C1"
    - "Deutsch auf B2"
    - "German language skills required"
    - "fluent German"
    - "native German"

# Hard stop 1 (issue #13): Austria only. Ahmad's Austrian student residence
# permit does not authorise work in Germany or Switzerland -- a Schengen
# short-stay (90/180 days) is not a work authorisation, and this is a permit
# scope limit, not a preference. Do not re-broaden this to DACH: Germany/
# Switzerland are covered separately by portals-cv2.yml, which targets
# full-time roles under a different (post-MSc) visa path.
#
# Regression case (issue #13): a Bosch "Praktikum AI Integration & Smart
# Engineering" posting (report 091, Wernau/Neckar, Germany, scored 4.5) was
# rejected by Ahmad for exactly this reason after the scorer missed it --
# `block` below now catches any future repeat of it (see the precedence note).
location_filter:
  allow:
    - "Austria"
    - "Österreich"
    - "Linz"
    - "Wien"
    - "Vienna"
    - "Graz"
    - "Salzburg"
    - "Villach"
    - "Pasching"
    - "Remote"
  # Explicit DE/CH terms so a posting that also matches "Remote" (e.g.
  # "Remote (Germany)") is still rejected -- block is checked BEFORE allow.
  # VERIFIED in scan.mjs's buildLocationFilter (not assumed): the check order
  # is always_allow > block > allow > "pass if allow is empty" > allow-match.
  # No always_allow is configured here, so block unconditionally wins over
  # allow for any of these terms -- this gate is not decorative.
  block:
    - "Germany"
    - "Deutschland"
    - "München"
    - "Munich"
    - "Berlin"
    - "Hamburg"
    - "Frankfurt"
    - "Stuttgart"
    - "Cologne"
    - "Köln"
    - "Walldorf"
    - "Switzerland"
    - "Zurich"
    - "Zürich"
  # Residual leak (stated, not silently accepted): a posting with NO location
  # data at all still passes (documented "don't penalize missing data"
  # posture, unchanged globally per the issue) -- an unlabeled German/Swiss
  # remote posting could still slip through. Not closed here; flagged for
  # Ahmad.

# No salary_filter — deliberate. Student-shaped roles rarely publish comp,
# and a floor would just drop everything.

# Freshness gate — offers older than 45 days are skipped (providers that
# expose no posting date are never penalized).
max_posting_age_days: 45

trust_filter:
  enabled: true

# -- Search queries --
search_queries:
  - name: karriere.at — Werkstudent AI/Data/Software
    query: 'site:karriere.at "Werkstudent" AI OR "Machine Learning" OR Data OR Software OR Python OR LLM'
    enabled: true

  - name: karriere.at — Praktikum AI/Data/Software
    query: 'site:karriere.at "Praktikum" AI OR "Machine Learning" OR Data OR Software OR Python OR LLM'
    enabled: true

  - name: Greenhouse — Werkstudent/Praktikum/Intern
    query: 'site:job-boards.greenhouse.io "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

  - name: Lever — Werkstudent/Praktikum/Intern
    query: 'site:jobs.lever.co "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

  - name: Ashby — Werkstudent/Praktikum/Intern
    query: 'site:jobs.ashbyhq.com "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

# -- Tracked companies + job boards --
# Every careers_url/api/provider slug below was live-verified (HTTP 200 against
# the actual API/board, not guessed from memory) before being added — see PR
# body for the verification notes. Aggregator boards (Arbeitnow, Arbeitsagentur,
# Amazon) are listed here too, not under a separate job_boards key, so they get
# picked up by validate-portals.mjs and verify-portals.mjs's schema/network checks.
tracked_companies:
  # -- Aggregators / job boards (DE/AT + EU coverage) --

  - name: Arbeitnow
    provider: arbeitnow
    max_pages: 3
    notes: "EU/DACH-heavy board aggregator, newest-first."
    enabled: true

  - name: Arbeitsagentur — Werkstudent/Praktikum Deutschland
    provider: arbeitsagentur
    arbeitsagentur:
      keywords:
        - "Werkstudent Data"
        - "Werkstudent KI"
        - "Werkstudent Softwareentwicklung"
        - "Praktikum Data Science"
      days: 30
      size: 100
    notes: "German federal jobs API (Bundesagentur für Arbeit). Germany-only by nature; Austria coverage comes from karriere.at/tracked companies instead. Each keyword verified live (6-60 hits) before inclusion."
    enabled: true

  - name: Amazon / AWS — Student Programs Germany
    provider: amazon
    amazon:
      base_query: "student"
      loc_query: "Germany"
    notes: "Global amazon.jobs board narrowed with a student keyword + Germany location signal (recall-first — scan.mjs's own title/location filters do the real gating). Verified live: surfaces real 'Working Student' Berlin postings."
    enabled: true

  # -- Big-tech EU/DACH intern & student programs (no ATS API — websearch handoff) --

  - name: Google — Students & Graduates
    careers_url: https://www.google.com/about/careers/applications/students/
    scan_method: websearch
    scan_query: 'site:google.com/about/careers/applications intern OR apprentice Germany OR Austria OR Munich OR Zurich'
    notes: "Custom platform, no ATS API. Live-verified filter URL: google.com/about/careers/applications/jobs/results/?location=Germany&target_level=INTERN_AND_APPRENTICE (0 DE/AT hits at verification time, but EU apprenticeships exist — kept for recurring scans)."
    enabled: true

  - name: Microsoft — Students
    careers_url: https://careers.microsoft.com/v2/global/en/students
    scan_method: websearch
    scan_query: 'site:careers.microsoft.com intern Germany OR Austria'
    notes: "Custom platform, no ATS API. Live-verified filter: apply.careers.microsoft.com/careers?location=Germany&filter_seniority=Intern (0 hits at verification time — kept for recurring scans)."
    enabled: true

  - name: Apple — Students
