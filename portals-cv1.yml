# portals-cv1.yml — Track 1: Werkstudent (AT) + Praktikum/internships (AT+DE+EU)
#
# Selected at scan time via CAREER_OPS_PORTALS=portals-cv1.yml (see
# fork issue #1 for the full spec/plan this file implements).
#
# Public targeting keywords + public company info only — no personal data.
# This file IS tracked in the fork (public repo).

title_filter:
  # German AND English student-role terms. Title match is substring-OR;
  # domain narrowing (AI/ML/Data/Software) happens in content_filter below,
  # not here — these terms alone are department-agnostic.
  positive:
    - "Werkstudent"
    - "Working Student"
    - "Praktikum"
    - "Praktikant"
    - "Intern"
    - "Internship"
    - "Trainee"
    - "Thesis"
    - "Diplomarbeit"
    - "Abschlussarbeit"
  negative:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "Manager"
    - "Sales"
    - "Marketing"
    - "Recruiting"
    - "HR"
    - "Legal"

# Domain narrowing on the job description. All of the title keywords above
# are department-agnostic (a "Werkstudent" or "Praktikum" posting exists in
# every department), so this applies globally rather than per-keyword via
# by_title_keyword — v1 measures the noise level first before tightening
# further to specific keywords.
content_filter:
  positive:
    - "AI"
    - "Machine Learning"
    - "ML"
    - "Data"
    - "Software"
    - "Backend"
    - "Python"
    - "LLM"

location_filter:
  allow:
    - "Austria"
    - "Österreich"
    - "Linz"
    - "Wien"
    - "Vienna"
    - "Graz"
    - "Salzburg"
    - "Germany"
    - "Deutschland"
    - "München"
    - "Munich"
    - "Berlin"
    - "Hamburg"
    - "Frankfurt"
    - "Stuttgart"
    - "Cologne"
    - "Köln"
    - "Walldorf"
    - "Villach"
    - "Pasching"
    - "Zurich"
    - "Zürich"
    - "Remote"
  # Empty for v1 — measure first before adding blocks.
  block: []

# No salary_filter — deliberate. Student-shaped roles rarely publish comp,
# and a floor would just drop everything.

# Freshness gate — offers older than 45 days are skipped (providers that
# expose no posting date are never penalized).
max_posting_age_days: 45

trust_filter:
  enabled: true

# -- Search queries --
# Note (from the issue, not enforceable at scan time): German-located roles
# titled "Werkstudent" are handled at eval, not by a title×location cross-gate
# here.
search_queries:
  - name: karriere.at — Werkstudent AI/Data/Software
    query: 'site:karriere.at "Werkstudent" AI OR "Machine Learning" OR Data OR Software OR Python OR LLM'
    enabled: true

  - name: karriere.at — Praktikum AI/Data/Software
    query: 'site:karriere.at "Praktikum" AI OR "Machine Learning" OR Data OR Software OR Python OR LLM'
    enabled: true

  - name: Greenhouse — Werkstudent/Praktikum/Intern
    query: 'site:job-boards.greenhouse.io "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

  - name: Lever — Werkstudent/Praktikum/Intern
    query: 'site:jobs.lever.co "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

  - name: Ashby — Werkstudent/Praktikum/Intern
    query: 'site:jobs.ashbyhq.com "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

# -- Tracked companies + job boards --
# Every careers_url/api/provider slug below was live-verified (HTTP 200 against
# the actual API/board, not guessed from memory) before being added — see PR
# body for the verification notes. Aggregator boards (Arbeitnow, Arbeitsagentur,
# Amazon) are listed here too, not under a separate job_boards key, so they get
# picked up by validate-portals.mjs and verify-portals.mjs's schema/network checks.
tracked_companies:
  # -- Aggregators / job boards (DE/AT + EU coverage) --

  - name: Arbeitnow
    provider: arbeitnow
    max_pages: 3
    notes: "EU/DACH-heavy board aggregator, newest-first."
    enabled: true

  - name: Arbeitsagentur — Werkstudent/Praktikum Deutschland
    provider: arbeitsagentur
    arbeitsagentur:
      keywords:
        - "Werkstudent Data"
        - "Werkstudent KI"
        - "Werkstudent Softwareentwicklung"
        - "Praktikum Data Science"
      days: 30
      size: 100
    notes: "German federal jobs API (Bundesagentur für Arbeit). Germany-only by nature; Austria coverage comes from karriere.at/tracked companies instead. Each keyword verified live (6-60 hits) before inclusion."
    enabled: true

  - name: Amazon / AWS — Student Programs Germany
    provider: amazon
    amazon:
      base_query: "student"
      loc_query: "Germany"
    notes: "Global amazon.jobs board narrowed with a student keyword + Germany location signal (recall-first — scan.mjs's own title/location filters do the real gating). Verified live: surfaces real 'Working Student' Berlin postings."
    enabled: true

  # -- Big-tech EU/DACH intern & student programs (no ATS API — websearch handoff) --

  - name: Google — Students & Graduates
    careers_url: https://www.google.com/about/careers/applications/students/
    scan_method: websearch
    scan_query: 'site:google.com/about/careers/applications intern OR apprentice Germany OR Austria OR Munich OR Zurich'
    notes: "Custom platform, no ATS API. Live-verified filter URL: google.com/about/careers/applications/jobs/results/?location=Germany&target_level=INTERN_AND_APPRENTICE (0 DE/AT hits at verification time, but EU apprenticeships exist — kept for recurring scans)."
    enabled: true

  - name: Microsoft — Students
    careers_url: https://careers.microsoft.com/v2/global/en/students
    scan_method: websearch
    scan_query: 'site:careers.microsoft.com intern Germany OR Austria'
    notes: "Custom platform, no ATS API. Live-verified filter: apply.careers.microsoft.com/careers?location=Germany&filter_seniority=Intern (0 hits at verification time — kept for recurring scans)."
    enabled: true

  - name: Apple — Students
    careers_url: https://www.apple.com/careers/uk/work-at-apple/students.html
    scan_method: websearch
    scan_query: 'site:jobs.apple.com internship Germany OR Munich'
    notes: "Custom platform, no ATS API. Live-verified filter: jobs.apple.com/en-us/search?location=germany-DEU&team=internships-STDNT-INTRN — 3 live Munich internships at verification time."
    enabled: true

  - name: Meta — University / Early Careers
    careers_url: https://www.metacareers.com/careerprograms/students/
    scan_method: websearch
    scan_query: 'site:metacareers.com intern OR university Germany OR Ireland OR Dublin'
    notes: "Custom platform, no ATS API. Meta University itself is US/Canada/Mexico-only per Meta's own page copy; EU inventory is thin/seasonal — kept for recurring scans, Dublin office is the nearest EU hub."
    enabled: true

