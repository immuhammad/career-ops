# portals-cv1.yml — Track 1: Werkstudent (AT) + Praktikum/internships (AT+DE+EU)
#
# Selected at scan time via CAREER_OPS_PORTALS=portals-cv1.yml (see
# fork issue #1 for the full spec/plan this file implements).
#
# Public targeting keywords + public company info only — no personal data.
# This file IS tracked in the fork (public repo).

title_filter:
  # German AND English student-role terms. Title match is substring-OR;
  # domain narrowing (AI/ML/Data/Software) happens in content_filter below,
  # not here — these terms alone are department-agnostic.
  positive:
    - "Werkstudent"
    - "Working Student"
    - "Praktikum"
    - "Praktikant"
    - "Intern"
    - "Internship"
    - "Trainee"
    - "Thesis"
    - "Diplomarbeit"
    - "Abschlussarbeit"
    # German compound-noun variants (#20): whole-word matching means the base
    # keywords above no longer match inside a longer compound ("Praktikum"
    # does not match "Pflichtpraktikum" -- no word boundary at the seam).
    # Measured against every distinct title in data/scan-history.tsv; each
    # entry below recovers a real, legitimate posting the boundary fix would
    # otherwise silently drop. Enumerated explicitly rather than loosened via
    # regex -- deterministic beats clever (per issue #20's own directive).
    - "Pflichtpraktikum" # mandatory-internship compound (Bosch et al.) -- 100 measured titles
    - "Jahrespraktikum" # year-long-internship compound
    - "Hochschulpraktikant" # university-internship compound
    - "Werkstudentin" # contiguous gendered suffix ("Werkstudent" + "in", no separator)
    - "Werkstudententätigkeit" # "working-student position" compound
    - "Praktikantin" # contiguous gendered suffix ("Praktikant" + "in", no separator)
    - "Praktikumsmöglichkeiten" # "internship opportunities" compound
    - "Internships" # plural -- "Internship" alone no longer matches the trailing "s"
  negative:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "Manager"
    - "Sales"
    - "Marketing"
    - "Recruiting"
    - "HR"
    - "Legal"

# Domain narrowing on the job description. All of the title keywords above
# are department-agnostic (a "Werkstudent" or "Praktikum" posting exists in
# every department), so this applies globally rather than per-keyword via
# by_title_keyword — v1 measures the noise level first before tightening
# further to specific keywords.
content_filter:
  positive:
    - "AI"
    - "Machine Learning"
    - "ML"
    - "Data"
    - "Software"
    - "Backend"
    - "Python"
    - "LLM"
  # NO `negative` block here for a German-language requirement -- deliberate,
  # not an oversight (issue #15, follow-up to #13's hard-stop 2a). Every
  # phrase tried failed under adversarial German phrasing:
  #   - Bare terms ("Deutschkenntnisse", "sehr gute Deutschkenntnisse") match
  #     the MOST COMMON real phrasing where German is OPTIONAL ("...von
  #     Vorteil", "...wuenschenswert") -- rejecting exactly the English-
  #     friendly Austrian roles this track exists to find.
  #   - Even compound, requirement-qualified phrases ("Deutschkenntnisse
  #     erforderlich", "verhandlungssicheres Deutsch") fail two more ways,
  #     verified empirically, not assumed: (a) German ad convention pairs a
  #     high fluency BAR with an optional marker just as often --
  #     "verhandlungssicheres Deutsch von Vorteil" is normal, unremarkable
  #     phrasing; (b) worse, a NEGATION reads as a false REJECT: "Keine
  #     Deutschkenntnisse erforderlich" (no German required at all -- the
  #     best possible case) contains "Deutschkenntnisse erforderlich" as a
  #     contiguous substring and gets wrongly rejected by it.
  # `content_filter` (scan.mjs) is flat substring matching with no negation
  # or proximity logic -- structurally incapable of this distinction. The
  # rule now lives in the eval layer instead (modes/_custom.md, user-layer,
  # not in this public file), where a full JD reading can tell requirement
  # from preference correctly. Do not re-add a negative list here for this;
  # an empty, honest gate beats a wrong one. See issue #15.

# Hard stop 1 (issue #13): Austria only. Ahmad's Austrian student residence
# permit does not authorise work in Germany or Switzerland -- a Schengen
# short-stay (90/180 days) is not a work authorisation, and this is a permit
# scope limit, not a preference. Do not re-broaden this to DACH: Germany/
# Switzerland are covered separately by portals-cv2.yml, which targets
# full-time roles under a different (post-MSc) visa path.
#
# Regression case (issue #13): a Bosch "Praktikum AI Integration & Smart
# Engineering" posting (report 091, Wernau/Neckar, Germany, scored 4.5) was
# rejected by Ahmad for exactly this reason after the scorer missed it --
# `block` below now catches any future repeat of it (see the precedence note).
location_filter:
  allow:
    - "Austria"
    - "Österreich"
    - "Linz"
    - "Wien"
    - "Vienna"
    - "Graz"
    - "Salzburg"
    - "Villach"
    - "Pasching"
    # NOTE: bare "Remote" was REMOVED here on 2026-07-30. Matching is substring,
    # so it matched "Remote-GA" (Georgia, USA) and "USA - Remote" -- which is how
    # a US "Law Clerk Intern" reached this Austrian working-student queue.
    # CV-1 does NOT get channel C's remote latitude (see modes/_profile.md):
    # the whole point of a Werkstudent/Praktikum is the AMS
    # Beschäftigungsbewilligung and a local foot in the door, and a remote
    # foreign internship delivers neither -- nor is sponsorship ever offered at
    # intern level. An Austrian remote role still matches via "Austria" /
    # "Österreich" / a city above (e.g. "Austria-Remote", "Remote (Wien)");
    # postings with NO location at all still pass, per the don't-penalise-
    # missing-data convention.
    - "Remote (Austria)"
    - "Remote Österreich"
    - "Homeoffice"
  # Explicit DE/CH terms so a posting that also matches "Remote" (e.g.
  # "Remote (Germany)") is still rejected -- block is checked BEFORE allow.
  # VERIFIED in scan.mjs's buildLocationFilter (not assumed): the check order
  # is always_allow > block > allow > "pass if allow is empty" > allow-match.
  # No always_allow is configured here, so block unconditionally wins over
  # allow for any of these terms -- this gate is not decorative.
  block:
    - "Germany"
    - "Deutschland"
    - "München"
    - "Munich"
    - "Berlin"
    - "Hamburg"
    - "Frankfurt"
    - "Stuttgart"
    - "Cologne"
    - "Köln"
    - "Walldorf"
    - "Switzerland"
    - "Zurich"
    - "Zürich"
  # Residual leak (stated, not silently accepted): a posting with NO location
  # data at all still passes (documented "don't penalize missing data"
  # posture, unchanged globally per the issue) -- an unlabeled German/Swiss
  # remote posting could still slip through. Not closed here; flagged for
  # Ahmad.

# No salary_filter — deliberate. Student-shaped roles rarely publish comp,
# and a floor would just drop everything.

# Freshness gate — offers older than 45 days are skipped (providers that
# expose no posting date are never penalized).
max_posting_age_days: 45

trust_filter:
  enabled: true

# -- Search queries --
search_queries:
  - name: karriere.at — Werkstudent AI/Data/Software
    query: 'site:karriere.at "Werkstudent" AI OR "Machine Learning" OR Data OR Software OR Python OR LLM'
    enabled: true

  - name: karriere.at — Praktikum AI/Data/Software
    query: 'site:karriere.at "Praktikum" AI OR "Machine Learning" OR Data OR Software OR Python OR LLM'
    enabled: true

  - name: Greenhouse — Werkstudent/Praktikum/Intern
    query: 'site:job-boards.greenhouse.io "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

  - name: Lever — Werkstudent/Praktikum/Intern
    query: 'site:jobs.lever.co "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

  - name: Ashby — Werkstudent/Praktikum/Intern
    query: 'site:jobs.ashbyhq.com "Werkstudent" OR "Praktikum" OR "Intern" AI OR "Machine Learning" OR Data OR Software'
    enabled: true

# -- Tracked companies + job boards --
# Company entries (Amazon, Google, Microsoft, ...) were migrated to the
# private, gitignored portals.yml on 2026-08-03 (issue #23). Only the
# board/aggregator sources (Arbeitnow, Arbeitsagentur) stay here — public,
# reviewed, source-of-truth for this track's search coverage.
tracked_companies:
  # Non-aggregator company entries were migrated to the private, gitignored
  # portals.yml on 2026-08-03 (issue #23) -- this file now carries
  # board/aggregator sources only, per the settled pattern issue #23 describes.

  # -- Aggregators / job boards (DE/AT + EU coverage) --

  - name: Arbeitnow
    provider: arbeitnow
    max_pages: 3
    notes: "EU/DACH-heavy board aggregator, newest-first."
    enabled: true

  - name: Arbeitsagentur — Werkstudent/Praktikum Deutschland
    provider: arbeitsagentur
    arbeitsagentur:
      keywords:
        - "Werkstudent Data"
        - "Werkstudent KI"
        - "Werkstudent Softwareentwicklung"
        - "Praktikum Data Science"
      days: 30
      size: 100
    notes: "German federal jobs API (Bundesagentur für Arbeit). Germany-only by nature; Austria coverage comes from karriere.at/tracked companies instead. Each keyword verified live (6-60 hits) before inclusion."
    enabled: true

