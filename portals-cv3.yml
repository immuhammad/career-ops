    notes: "Custom site (direct fetch blocked by bot protection at verification time; content confirmed indirectly via search-indexed job pages) — websearch handoff. Confirmed live Magento 2 Backend Developer / Ecommerce Solutions Architect postings, but Miami-based, not EU-remote — kept per the issue's explicit seed list, weigh accordingly at eval."
