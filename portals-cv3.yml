# portals-cv3.yml — Track 3: senior Magento / Adobe Commerce / Laravel / PHP,
# English-speaking, EU-remote-friendly.
#
# Selected at scan time via CAREER_OPS_PORTALS=portals-cv3.yml (see
# fork issue #3 for the full spec/plan this file implements).
#
# Public targeting keywords + public company info only — no personal data.
# This file IS tracked in the fork (public repo).

title_filter:
  # "Backend Engineer" is deliberately broad (measure first, per the issue) —
  # content_filter.by_title_keyword below narrows it to commerce-shaped roles
  # so it doesn't flood with unrelated backend postings.
  positive:
    - "Magento"
    - "Adobe Commerce"
    - "Laravel"
    - "PHP"
    - "E-commerce Backend"
    - "eCommerce Backend"
    - "Shopify Backend"
    - "Shopify App"
    - "Backend Engineer"
  negative:
    - "Junior"
    - "Intern"
    - "Werkstudent"
    - "Praktikum"
    - "WordPress"
    - "Frontend"
    - "Designer"
    - "Trainee"

content_filter:
  by_title_keyword:
    "Backend Engineer":
      positive:
        - "Magento"
        - "Adobe Commerce"
        - "Laravel"
        - "PHP"
        - "e-commerce"

# Precedence in buildLocationFilter (scan.mjs:230):
#   always_allow > block > allow > pass-if-allow-empty
# Each list is matched as a case-insensitive SUBSTRING against the location
# string AND the URL hint. That substring behaviour is why the bare token
# "Remote" in `allow` used to pass "USA---Remote-NY", "Remote, India" and
# "CHN---Remote---Lanzhou" — measured 2026-07-30, and the source of every
# sub-2.0 US/APAC eval in the 2026-07-29 batch. `allow` stays permissive on
# purpose; `block` below is what makes it safe.
location_filter:
  # always_allow WINS over block. "Remote" is FIRST here on purpose (channel C,
  # 2026-07-30): Ahmad holds an Austrian Gewerbe and invoices B2B, so remote work
  # for a client in ANY country is legal from Linz and needs no foreign permit.
  # The country block below therefore only catches genuinely ON-SITE non-EU roles
  # -- anything marked remote passes here first and is judged at the eval layer,
  # which is the only place that can read "US residents only" / "W-2 only" /
  # "employment via our X entity" (house rule 18). Substring gates cannot.
  always_allow:
    - "Remote"
    - "Anywhere"
    - "Worldwide"
    - "Distributed"
    - "Homeoffice"
    - "Home office"
    - "Austria"
    - "Österreich"
    - "Vienna"
    - "Wien"
    - "Linz"
    - "Graz"
    - "Salzburg"
    # Austrian towns that appear as bare city strings with no country suffix.
    # Without these they fall through always_allow AND block to the allow list,
    # which has no entry for them -- "Pasching" was silently rejected this way.
    - "Villach"
    - "Pasching"
    - "Innsbruck"
    - "Klagenfurt"
    - "Wels"
    - "Steyr"
    - "Leonding"
    - "Traun"
    - "Hagenberg"
    - "St. Pölten"
    - "Europe"
    - "Europa"
    - "EMEA"
    - "European Union"
    - "Germany"
    - "Deutschland"
    - "Netherlands"
    - "Nederland"
    - "Belgium"
    - "België"
    - "Ireland"
    - "Poland"
    - "Polska"
    - "Latvia"
    - "Lithuania"
    - "Estonia"
    - "Czech"
    - "Slovakia"
    - "Slovenia"
    - "Hungary"
    - "Romania"
    - "Bulgaria"
    - "Croatia"
    - "France"
    - "Spain"
    - "España"
    - "Portugal"
    - "Italy"
    - "Italia"
    - "Sweden"
    - "Denmark"
    - "Finland"
    - "Norway"
    - "United Kingdom"
    - "London"
    - "Manchester"
    - "Bristol"
    - "Amsterdam"
    - "Paris"
    - "Berlin"
    - "Munich"
    - "München"
  # Non-EU. Nothing in the deterministic chain checks work authorisation, so
  # this list is the only thing keeping US/APAC/LATAM roles out of the queue.
  #
  # ONLY unambiguous multi-character tokens. Short codes are landmines under
  # substring matching — verified against all 215 distinct locations seen so
  # far (2026-07-30): "AUS" blocks Austria, "KOR" blocks Korneuburg, "ARE"
  # blocks "Hamburg Area", "US" blocks Austria, "CH" blocks Munich, "IN"
  # blocks Linz. Do NOT add two-letter country codes here.
  block:
    - "USA"
    - "U.S."
    - "United States"
    - "Puerto Rico"
    - "Canada"
    - "India"
    - "China"
    - "CHN"
    - "Hong Kong"
    - "Singapore"
    - "Malaysia"
    - "Indonesia"
    - "Philippines"
    - "Vietnam"
    - "Thailand"
    - "Japan"
    - "Korea"
    - "Taiwan"
    - "Australia"
    - "New Zealand"
    - "Brazil"
    - "Mexico"
    - "Argentina"
    - "Colombia"
    - "Chile"
    - "Peru"
    - "Nigeria"
    - "South Africa"
    - "Kenya"
    - "Egypt"
    - "Morocco"
    - "Israel"
    - "Turkey"
    - "Türkiye"
    - "Dubai"
    - "United Arab Emirates"
    - "Saudi"
    - "Qatar"
    - "Pakistan"
    - "Bangladesh"
    - "Sri Lanka"
    - "Nepal"
    - "APAC"
    - "LATAM"
    - "Americas"
  allow:
    - "Remote"
    - "EU"
    - "Europe"
    - "Austria"
    - "Germany"
    - "Netherlands"
    - "United Kingdom"
    - "Worldwide"
    - "Latvia"
    - "Poland"
    - "Belgium"
    - "Amsterdam"
    - "Groningen"
    - "London"
    - "Bristol"
    - "Stafford"
    - "Shrewsbury"

# Ahmad's own stated income floor for this track (senior Magento/Laravel),
# not a government-regulated threshold like CV-1/CV-2's visa-linked figures
# — see .harness/handoff.md's decisions log. Re-confirm with Ahmad before
# relying on this number in any actual application decision. Missing salary
# passes (correct default) — agencies often don't list comp.
salary_filter:
  min: 50000
  max: 0
  currency: "EUR"

max_posting_age_days: 45

trust_filter:
  enabled: true

search_queries:
  - name: Greenhouse — Magento/Adobe Commerce/Laravel senior
    query: 'site:job-boards.greenhouse.io "Magento" OR "Adobe Commerce" OR "Laravel" senior OR lead PHP'
    enabled: true

  - name: Lever — Magento/Adobe Commerce/Laravel senior
    query: 'site:jobs.lever.co "Magento" OR "Adobe Commerce" OR "Laravel" senior OR lead PHP'
    enabled: true

  - name: Ashby — Magento/Adobe Commerce/Laravel senior
    query: 'site:jobs.ashbyhq.com "Magento" OR "Adobe Commerce" OR "Laravel" senior OR lead PHP'
    enabled: true

# -- Tracked companies --
# Every careers_url below was live-verified (HTTP 200 + real listing content,
# not guessed from memory) before being added. Almost none of these agencies
# run a zero-token-provider-supported ATS (custom sites, TeamTailor, or a
# Recruitee instance on a BRANDED domain that providers/recruitee.mjs's strict
# <slug>.recruitee.com hostname match doesn't cover) — confirmed by reading
# the provider source, not assumed — so this track leans on Arbeitnow (a real
# zero-token board) plus websearch handoff for the rest, per the issue's own
# "arbeitnow provider entry" hint under Sources.
tracked_companies:
  # Non-aggregator company entries were migrated to the private, gitignored
  # portals.yml on 2026-08-03 (issue #23) -- this file now carries
  # board/aggregator sources only, per the settled pattern issue #23 describes.

  - name: Arbeitnow
    provider: arbeitnow
    max_pages: 3
    notes: "EU/DACH-heavy board aggregator, newest-first — the one real zero-token source for this track's smaller agency postings."
    enabled: true

  - name: LaraJobs
    provider: larajobs
    notes: "Board-wide public RSS feed at larajobs.com/feed (Laravel/PHP jobs), zero-token, no per-tenant config needed. Verified live (200 OK). Adds real zero-token coverage for a track that previously had none."
    enabled: true
